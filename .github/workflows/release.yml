name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install locked Pixi development environment
        uses: prefix-dev/setup-pixi@v0.10.1
        with:
          pixi-version: v0.76.2
          environments: dev
          cache: true
          locked: true

      - name: Validate release version
        id: release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          pixi run --environment dev uv lock --check
          pixi run --environment dev python - <<'PY'
          import os
          import re
          import subprocess
          import tomllib
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          match = re.fullmatch(r"v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", tag)
          if match is None:
              raise SystemExit(f"release tag is not stable SemVer: {tag}")
          version = tag.removeprefix("v")

          with Path("pyproject.toml").open("rb") as pyproject_file:
              project_version = tomllib.load(pyproject_file)["project"]["version"]

          rendered_config = subprocess.run(
              ["nextflow", "config", "-flat"],
              check=True,
              capture_output=True,
              text=True,
          ).stdout
          manifest_match = re.search(
              r"(?m)^manifest\.version\s*=\s*['\"]([^'\"]+)['\"]$",
              rendered_config,
          )
          if manifest_match is None:
              raise SystemExit("nextflow.config does not render manifest.version")
          manifest_version = manifest_match.group(1)

          with Path("uv.lock").open("rb") as lock_file:
              locked_packages = tomllib.load(lock_file)["package"]
          locked_version = next(
              package["version"]
              for package in locked_packages
              if package["name"] == "baits" and package.get("source", {}).get("virtual") == "."
          )

          versions = {
              "tag": version,
              "pyproject.toml": project_version,
              "nextflow.config": manifest_version,
              "uv.lock": locked_version,
          }
          if len(set(versions.values())) != 1:
              details = "\n".join(f"{source}: {value}" for source, value in versions.items())
              raise SystemExit(f"release versions disagree:\n{details}")

          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as output_file:
              output_file.write(f"tag={tag}\n")
              output_file.write(f"version={version}\n")
          PY

      - name: Run release checks
        run: |
          pixi run --environment dev lint-python
          pixi run --environment dev typecheck-python
          pixi run --environment dev test-python

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build release monoimage
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Containerfile
          push: false
          load: true
          tags: nrminor/baits:${{ steps.release.outputs.version }}
          labels: |
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=baits-monoimage
          cache-to: type=gha,mode=max,scope=baits-monoimage

      - name: Smoke-test release monoimage
        run: |
          docker run --rm --env TERM=dumb \
            nrminor/baits:${{ steps.release.outputs.version }} \
            bash -euo pipefail -c '
              cd /opt/baits
              python -c "import Bio, polars"
              blastn -version
              meryl --version
              deacon --version
              pytest tests/python/test_dependency_versions.py
            '

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push immutable monoimage
        run: docker push nrminor/baits:${{ steps.release.outputs.version }}

      - name: Build source archive
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          git archive \
            --format=tar.gz \
            --prefix="baits-${VERSION}/" \
            --output="baits-${VERSION}.tar.gz" \
            "${GITHUB_SHA}"
          sha256sum "baits-${VERSION}.tar.gz" > "baits-${VERSION}.tar.gz.sha256"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: dholab/baits ${{ steps.release.outputs.tag }}
          generate_release_notes: true
          prerelease: false
          files: |
            baits-${{ steps.release.outputs.version }}.tar.gz
            baits-${{ steps.release.outputs.version }}.tar.gz.sha256

      - name: Publish latest monoimage tag
        run: |
          docker tag \
            nrminor/baits:${{ steps.release.outputs.version }} \
            nrminor/baits:latest
          docker push nrminor/baits:latest
