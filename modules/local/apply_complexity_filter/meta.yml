# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: apply_complexity_filter
description: Apply Deacon entropy results to candidate k-mers.
keywords:
  - k-mer
  - entropy
  - complexity
tools:
  - python:
      description: Python programming language.
      homepage: https://www.python.org/
      documentation: https://docs.python.org/3/
      tool_dev_url: https://github.com/python/cpython
      licence:
        - PSF-2.0
input:
  - - meta:
        type: map
        description: Design metadata.
    - manifest:
        type: file
        description: Candidate k-mer manifest before low-complexity filtering.
        ontologies: []
    - passing_kmers:
        type: file
        description: Deacon-dumped entropy-passing k-mers.
        ontologies: []
output:
  manifest:
    - - meta:
          type: map
          description: Design metadata.
      - candidate_kmers.tsv:
          type: file
          description: Complete manifest after low-complexity filtering.
          pattern: candidate_kmers.tsv
          ontologies:
            - edam: http://edamontology.org/format_3475 # TSV
  candidates:
    - - meta:
          type: map
          description: Design metadata.
      - selected_candidates.fasta:
          type: file
          description: Optional FASTA containing candidates selected after complexity filtering.
          pattern: selected_candidates.fasta
          ontologies: []
  versions_biopython:
    - - ${task.process}:
          type: string
          description: Process name.
      - biopython:
          type: string
          description: Tool name.
      - python -c 'import Bio; print(Bio.__version__)':
          type: eval
          description: Runtime Biopython version.
  versions_polars:
    - - ${task.process}:
          type: string
          description: Process name.
      - polars:
          type: string
          description: Tool name.
      - python -c 'import polars; print(polars.__version__)':
          type: eval
          description: Runtime Polars version.
topics:
  versions:
    - - ${task.process}:
          type: string
          description: Process name.
      - biopython:
          type: string
          description: Tool name.
      - python -c 'import Bio; print(Bio.__version__)':
          type: eval
          description: Runtime Biopython version.
    - - ${task.process}:
          type: string
          description: Process name.
      - polars:
          type: string
          description: Tool name.
      - python -c 'import polars; print(polars.__version__)':
          type: eval
          description: Runtime Polars version.
authors:
  - dholab/baits
