# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: apply_taxonomic_screening
description: Apply exact taxonomic BLAST matches to selected candidate k-mers.
keywords:
  - taxonomy
  - blast
  - k-mer
tools:
  - biopython:
      description: Python tools for biological computation.
      homepage: https://biopython.org/
      documentation: https://biopython.org/wiki/Documentation
      tool_dev_url: https://github.com/biopython/biopython
      licence:
        - BSD-3-Clause
      identifier: biotools:biopython
  - polars:
      description: DataFrame library for typed rectangular transformations.
      homepage: https://pola.rs/
      documentation: https://docs.pola.rs/
      tool_dev_url: https://github.com/pola-rs/polars
      licence:
        - MIT
input:
  - - meta:
        type: map
        description: Design metadata.
    - candidates:
        type: file
        description: Candidate k-mers selected before taxonomic screening.
        ontologies: []
    - blast_hits:
        type: file
        description: Headered exact-match taxonomic BLAST results.
        ontologies:
          - edam: http://edamontology.org/format_3475 # TSV
    - candidate_kmer_manifest:
        type: file
        description: Candidate k-mer manifest before taxonomic screening.
        ontologies:
          - edam: http://edamontology.org/format_3475 # TSV
    - target_taxid:
        type: string
        description: Target NCBI taxonomy identifier.
    - kmer_size:
        type: integer
        description: Exact candidate k-mer length.
output:
  manifest:
    - - meta:
          type: map
          description: Design metadata.
      - candidate_kmers.tsv:
          type: file
          description: Regenerated candidate k-mer manifest.
          pattern: candidate_kmers.tsv
          ontologies:
            - edam: http://edamontology.org/format_3475 # TSV
  candidates:
    - - meta:
          type: map
          description: Design metadata.
      - selected_candidates.fasta:
          type: file
          description: Candidates selected after taxonomic screening; empty when none are selected.
          pattern: selected_candidates.fasta
          ontologies: []
  versions_biopython:
    - - ${task.process}:
          type: string
          description: Process name.
      - biopython:
          type: string
          description: Tool name.
      - python -c 'import Bio; print(Bio.__version__)':
          type: eval
          description: Runtime Biopython version.
  versions_polars:
    - - ${task.process}:
          type: string
          description: Process name.
      - polars:
          type: string
          description: Tool name.
      - python -c 'import polars; print(polars.__version__)':
          type: eval
          description: Runtime Polars version.
topics:
  versions:
    - - ${task.process}:
          type: string
          description: Process name.
      - biopython:
          type: string
          description: Tool name.
      - python -c 'import Bio; print(Bio.__version__)':
          type: eval
          description: Runtime Biopython version.
    - - ${task.process}:
          type: string
          description: Process name.
      - polars:
          type: string
          description: Tool name.
      - python -c 'import polars; print(polars.__version__)':
          type: eval
          description: Runtime Polars version.
authors:
  - dholab/baits
