# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: blastn_calibration_reads
description: Search deduplicated calibration-read queries against a taxonomic BLAST database.
keywords:
  - blast
  - calibration
  - reads
tools:
  - blast:
      description: NCBI BLAST sequence similarity search tools.
      homepage: https://blast.ncbi.nlm.nih.gov/
      licence:
        - US-Government-Work
input:
  - - meta:
        type: map
        description: Design metadata.
    - queries:
        type: file
        description: Deduplicated calibration-read query FASTA shard.
        ontologies: []
    - taxonomic_reference_db:
        type: directory
        description: Taxonomy-aware BLAST nucleotide database directory.
output:
  hits:
    - - meta:
          type: map
          description: Design metadata.
      - read_blast_hits.tsv:
          type: file
          description: Bounded calibration-read BLAST matches.
          pattern: "*.read_blast_hits.tsv"
          ontologies:
            - edam: http://edamontology.org/format_3475 # TSV
  reported_blast:
    - - meta:
          type: map
          description: Design metadata.
      - blast:
          type: string
          description: Component name.
      - 'blastn -version 2>&1 | sed "s/^.*blastn: //; s/ .*$//; s/+.*$//"':
          type: eval
          description: Runtime BLAST version.
  versions_blast:
    - - ${task.process}:
          type: string
          description: Process name.
      - blast:
          type: string
          description: Component name.
      - 'blastn -version 2>&1 | sed "s/^.*blastn: //; s/ .*$//; s/+.*$//"':
          type: eval
          description: Runtime BLAST version.
topics:
  versions:
    - - ${task.process}:
          type: string
          description: Process name.
      - blast:
          type: string
          description: Component name.
      - 'blastn -version 2>&1 | sed "s/^.*blastn: //; s/ .*$//; s/+.*$//"':
          type: eval
          description: Runtime BLAST version.
authors:
  - dholab/baits
