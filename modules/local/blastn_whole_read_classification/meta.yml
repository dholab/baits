# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: blastn_whole_read_classification
description: Align strand-deduplicated candidate reads against a taxonomic reference database.
keywords:
  - blast
  - reads
  - taxonomy
tools:
  - blast:
      description: NCBI BLAST command line applications.
      homepage: https://blast.ncbi.nlm.nih.gov/Blast.cgi
      documentation: https://www.ncbi.nlm.nih.gov/books/NBK279690/
      tool_dev_url: https://www.ncbi.nlm.nih.gov/books/NBK279690/
      licence:
        - US-Government-Work
input:
  - - meta:
        type: map
        description: Design metadata.
    - queries:
        type: file
        description: Strand-deduplicated whole-read BLAST query FASTA.
        ontologies: []
    - taxonomic_reference_db:
        type: directory
        description: Taxonomic reference database directory.
output:
  hits:
    - - meta:
          type: map
          description: Design metadata.
      - whole_read_blast_hits.tsv:
          type: file
          description: Headered whole-read BLAST evidence.
          pattern: whole_read_blast_hits.tsv
          ontologies:
            - edam: http://edamontology.org/format_3475 # TSV
  versions_blast:
    - - ${task.process}:
          type: string
          description: Process name.
      - blast:
          type: string
          description: Tool name.
      - 'blastn -version 2>&1 | sed "s/^.*blastn: //; s/ .*$//; s/+.*$//"':
          type: eval
          description: Runtime BLAST version.
  reported_blast:
    - - meta:
          type: map
          description: Design metadata.
      - blast:
          type: string
          description: Tool name.
      - 'blastn -version 2>&1 | sed "s/^.*blastn: //; s/ .*$//; s/+.*$//"':
          type: eval
          description: Runtime BLAST version.
topics:
  versions:
    - - ${task.process}:
          type: string
          description: Process name.
      - blast:
          type: string
          description: Tool name.
      - 'blastn -version 2>&1 | sed "s/^.*blastn: //; s/ .*$//; s/+.*$//"':
          type: eval
          description: Runtime BLAST version.
authors:
  - dholab/baits
