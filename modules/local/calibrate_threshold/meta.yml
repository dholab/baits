# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: derive_recommended_threshold
description: Derive one recommended bait-count threshold from scored calibration reads.
keywords:
  - calibration
  - threshold
  - reads
tools:
  - python:
      description: Python programming language.
      homepage: https://www.python.org/
      documentation: https://docs.python.org/3/
      tool_dev_url: https://github.com/python/cpython
      licence:
        - PSF-2.0
input:
  - - meta:
        type: map
        description: Design metadata.
    - calibration_reads:
        type: file
        description: Per-read bait counts and best target and other bit scores.
        pattern: calibration_reads.tsv
        ontologies:
          - edam: http://edamontology.org/format_3475 # TSV
output:
  threshold:
    - - meta:
          type: map
          description: Design metadata.
      - recommended_threshold.tsv:
          type: file
          description: Internal recommended threshold projection for one design.
          pattern: recommended_threshold.tsv
          ontologies:
            - edam: http://edamontology.org/format_3475 # TSV
  versions_python:
    - - ${task.process}:
          type: string
          description: Process name.
      - python:
          type: string
          description: Tool name.
      - python --version | sed 's/Python //':
          type: eval
          description: Runtime Python version.
topics:
  versions:
    - - ${task.process}:
          type: string
          description: Process name.
      - python:
          type: string
          description: Tool name.
      - python --version | sed 's/Python //':
          type: eval
          description: Runtime Python version.
authors:
  - dholab/baits
