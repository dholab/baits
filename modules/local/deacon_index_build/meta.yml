# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: deacon_index_build
description: Build a Deacon index using explicit scientific parameters.
keywords:
  - k-mer
  - entropy
  - deacon
tools:
  - deacon:
      description: Accelerated DNA sequence search using minimizers.
      homepage: https://github.com/arcinstitute/deacon
      documentation: https://github.com/arcinstitute/deacon
      tool_dev_url: https://github.com/arcinstitute/deacon
      licence:
        - MIT
input:
  - - meta:
        type: map
        description: Design metadata.
    - fasta:
        type: file
        description: FASTA used to build the Deacon index.
        ontologies: []
    - kmer_size:
        type: integer
        description: K-mer size.
    - deacon_window:
        type: integer
        description: Deacon minimizer window size.
    - entropy_threshold:
        type: float
        description: Minimum scaled entropy threshold.
output:
  index:
    - - meta:
          type: map
          description: Design metadata.
      - deacon.idx:
          type: file
          description: Deacon index.
          pattern: deacon.idx
          ontologies: []
  versions_deacon:
    - - ${task.process}:
          type: string
          description: Process name.
      - deacon:
          type: string
          description: Tool name.
      - deacon --version | sed 's/^deacon //':
          type: eval
          description: Runtime Deacon version.
  reported_deacon:
    - - meta:
          type: map
          description: Design metadata.
      - deacon:
          type: string
          description: Tool name.
      - deacon --version | sed 's/^deacon //':
          type: eval
          description: Runtime Deacon version.
topics:
  versions:
    - - ${task.process}:
          type: string
          description: Process name.
      - deacon:
          type: string
          description: Tool name.
      - deacon --version | sed 's/^deacon //':
          type: eval
          description: Runtime Deacon version.
authors:
  - dholab/baits
