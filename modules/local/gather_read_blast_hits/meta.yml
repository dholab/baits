# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: gather_read_blast_hits
description: Combine calibration-read BLAST match shards into one table.
keywords:
  - blast
  - reads
tools:
  - python:
      description: Python programming language.
      homepage: https://www.python.org/
      documentation: https://docs.python.org/3/
      tool_dev_url: https://github.com/python/cpython
      licence:
        - PSF-2.0
input:
  - - meta:
        type: map
        description: Design metadata.
    - blast_hit_shards:
        type: file
        description: BLAST result tables for the query files.
        pattern: "*.read_blast_hits.tsv"
        ontologies:
          - edam: http://edamontology.org/format_3475 # TSV
output:
  hits:
    - - meta:
          type: map
          description: Design metadata.
      - read_blast_hits.tsv:
          type: file
          description: Combined calibration-read BLAST matches.
          pattern: read_blast_hits.tsv
          ontologies:
            - edam: http://edamontology.org/format_3475 # TSV
  versions_python:
    - - ${task.process}:
          type: string
          description: Process name.
      - python:
          type: string
          description: Tool name.
      - python --version | sed 's/Python //':
          type: eval
          description: Runtime Python version.
topics:
  versions:
    - - ${task.process}:
          type: string
          description: Process name.
      - python:
          type: string
          description: Tool name.
      - python --version | sed 's/Python //':
          type: eval
          description: Runtime Python version.
authors:
  - dholab/baits
