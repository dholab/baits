# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: prepare_read_blast_queries
description: Combine per-metagenome bait counts and prepare unique calibration BLAST queries.
keywords:
  - blast
  - reads
  - deduplication
tools:
  - biopython:
      description: Python tools for computational molecular biology.
      homepage: https://biopython.org/
      documentation: https://biopython.org/wiki/Documentation
      tool_dev_url: https://github.com/biopython/biopython
      licence:
        - BSD-3-Clause
      identifier: biotools:biopython
input:
  - - meta:
        type: map
        description: Design metadata.
    - counts:
        type: file
        description: Per-metagenome read bait count tables.
        pattern: "*.read_bait_counts.tsv"
        ontologies:
          - edam: http://edamontology.org/format_3475 # TSV
    - unique_fasta:
        type: file
        description: Globally deduplicated canonical candidate sequences.
        ontologies: []
output:
  counts:
    - - meta:
          type: map
          description: Design metadata.
      - read_bait_counts.tsv:
          type: file
          description: Bait count and shared query identity for every candidate read.
          pattern: read_bait_counts.tsv
          ontologies:
            - edam: http://edamontology.org/format_3475 # TSV
  queries:
    - - meta:
          type: map
          description: Design metadata.
      - read_queries.fasta:
          type: file
          description: Globally deduplicated read BLAST query FASTA; empty when there are no candidate reads.
          pattern: read_queries.fasta
          ontologies: []
  versions_biopython:
    - - ${task.process}:
          type: string
          description: Process name.
      - biopython:
          type: string
          description: Tool name.
      - python -c 'import Bio; print(Bio.__version__)':
          type: eval
          description: Runtime Biopython version.
topics:
  versions:
    - - ${task.process}:
          type: string
          description: Process name.
      - biopython:
          type: string
          description: Tool name.
      - python -c 'import Bio; print(Bio.__version__)':
          type: eval
          description: Runtime Biopython version.
authors:
  - dholab/baits
