# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: report_calibration_results
description: Publish run-wide calibration read rows and raw BLAST matches.
keywords:
  - calibration
  - blast
  - reads
tools:
  - python:
      description: Python programming language.
      homepage: https://www.python.org/
      documentation: https://docs.python.org/3/
      tool_dev_url: https://github.com/python/cpython
      licence:
        - PSF-2.0
input:
  - - design_ids:
        type: file
        description: Ordered design identifiers corresponding to the staged table directories.
        pattern: calibration_design_ids.txt
        ontologies: []
    - calibration_reads:
        type: file
        description: Per-design calibration read tables.
        pattern: calibration_reads.tsv
        ontologies:
          - edam: http://edamontology.org/format_3475 # TSV
    - calibration_matches:
        type: file
        description: Per-design gathered calibration BLAST matches.
        pattern: read_blast_hits.tsv
        ontologies:
          - edam: http://edamontology.org/format_3475 # TSV
output:
  reads:
    - calibration_reads.tsv:
        type: file
        description: Per-read bait counts and best target and other scores across designs.
        pattern: calibration_reads.tsv
        ontologies:
          - edam: http://edamontology.org/format_3475 # TSV
  matches:
    - calibration_matches.tsv.gz:
        type: file
        description: Compressed raw calibration BLAST matches across designs.
        pattern: calibration_matches.tsv.gz
        ontologies:
          - edam: http://edamontology.org/format_3475 # TSV
  versions_python:
    - - ${task.process}:
          type: string
          description: Process name.
      - python:
          type: string
          description: Tool name.
      - python --version | sed 's/Python //':
          type: eval
          description: Runtime Python version.
  versions_polars:
    - - ${task.process}:
          type: string
          description: Process name.
      - polars:
          type: string
          description: Tool name.
      - python -c 'import polars; print(polars.__version__)':
          type: eval
          description: Runtime Polars version.
topics:
  versions:
    - - ${task.process}:
          type: string
          description: Process name.
      - python:
          type: string
          description: Tool name.
      - python --version | sed 's/Python //':
          type: eval
          description: Runtime Python version.
    - - ${task.process}:
          type: string
          description: Process name.
      - polars:
          type: string
          description: Tool name.
      - python -c 'import polars; print(polars.__version__)':
          type: eval
          description: Runtime Polars version.
authors:
  - dholab/baits
