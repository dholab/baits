# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: score_calibration_reads
description: Project each calibration query's best target and other BLAST scores onto every read observation.
keywords:
  - blast
  - calibration
  - reads
tools:
  - python:
      description: Python programming language.
      homepage: https://www.python.org/
      documentation: https://docs.python.org/3/
      tool_dev_url: https://github.com/python/cpython
      licence:
        - PSF-2.0
input:
  - - meta:
        type: map
        description: Design metadata.
    - read_bait_counts:
        type: file
        description: Bait count and shared query identity for every candidate read.
        pattern: read_bait_counts.tsv
        ontologies:
          - edam: http://edamontology.org/format_3475 # TSV
    - blast_matches:
        type: file
        description: Gathered calibration-query BLAST matches.
        pattern: read_blast_hits.tsv
        ontologies:
          - edam: http://edamontology.org/format_3475 # TSV
    - target_taxid:
        type: string
        description: Target NCBI taxonomy identifier.
    - calibration_target_taxids:
        type: file
        description: Optional taxid scope used only for calibration-read score interpretation.
        ontologies: []
output:
  reads:
    - - meta:
          type: map
          description: Design metadata.
      - calibration_reads.tsv:
          type: file
          description: Per-read bait counts and best target and other scores for one design.
          pattern: calibration_reads.tsv
          ontologies:
            - edam: http://edamontology.org/format_3475 # TSV
  versions_python:
    - - ${task.process}:
          type: string
          description: Process name.
      - python:
          type: string
          description: Tool name.
      - python --version | sed 's/Python //':
          type: eval
          description: Runtime Python version.
  versions_polars:
    - - ${task.process}:
          type: string
          description: Process name.
      - polars:
          type: string
          description: Tool name.
      - python -c 'import polars; print(polars.__version__)':
          type: eval
          description: Runtime Polars version.
topics:
  versions:
    - - ${task.process}:
          type: string
          description: Process name.
      - python:
          type: string
          description: Tool name.
      - python --version | sed 's/Python //':
          type: eval
          description: Runtime Python version.
    - - ${task.process}:
          type: string
          description: Process name.
      - polars:
          type: string
          description: Tool name.
      - python -c 'import polars; print(polars.__version__)':
          type: eval
          description: Runtime Polars version.
authors:
  - dholab/baits
