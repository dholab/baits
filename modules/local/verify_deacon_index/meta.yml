# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: verify_deacon_index
description: Verify Deacon round trips against selected candidate k-mers.
keywords:
  - deacon
  - k-mer
  - verification
tools:
  - biopython:
      description: Python tools for biological computation.
      homepage: https://biopython.org/
      documentation: https://biopython.org/wiki/Documentation
      tool_dev_url: https://github.com/biopython/biopython
      licence:
        - BSD-3-Clause
      identifier: biotools:biopython
  - python:
      description: Python programming language.
      homepage: https://www.python.org/
      documentation: https://docs.python.org/3/
      tool_dev_url: https://github.com/python/cpython
      licence:
        - PSF-2.0
input:
  - - meta:
        type: map
        description: Immutable design metadata.
    - baits:
        type: file
        description: Bait FASTA used to build the Deacon index.
        ontologies: []
    - bait_roundtrip:
        type: file
        description: Baits retained by the Deacon index at the permissive threshold.
        ontologies: []
    - background_roundtrip:
        type: file
        description: Background records retained at the permissive threshold.
        ontologies: []
    - candidate_kmer_manifest:
        type: file
        description: Complete candidate k-mer manifest.
        ontologies:
          - edam: http://edamontology.org/format_3475 # TSV
    - deacon_index:
        type: file
        description: Deacon index being verified.
        ontologies: []
    - kmer_size:
        type: integer
        description: Candidate k-mer size.
output:
  index:
    - - meta:
          type: map
          description: Immutable design metadata.
      - deacon.idx:
          type: file
          description: Verified Deacon index.
          pattern: deacon.idx
          ontologies: []
  versions_biopython:
    - - ${task.process}:
          type: string
          description: Process name.
      - biopython:
          type: string
          description: Tool name.
      - python -c 'import Bio; print(Bio.__version__)':
          type: eval
          description: Runtime Biopython version.
  versions_python:
    - - ${task.process}:
          type: string
          description: Process name.
      - python:
          type: string
          description: Tool name.
      - python --version | sed 's/Python //':
          type: eval
          description: Runtime Python version.
topics:
  versions:
    - - ${task.process}:
          type: string
          description: Process name.
      - biopython:
          type: string
          description: Tool name.
      - python -c 'import Bio; print(Bio.__version__)':
          type: eval
          description: Runtime Biopython version.
    - - ${task.process}:
          type: string
          description: Process name.
      - python:
          type: string
          description: Tool name.
      - python --version | sed 's/Python //':
          type: eval
          description: Runtime Python version.
authors:
  - dholab/baits
